# ============================================================
# Çakabey AUV - Konfigürasyon Dosyası
# TEKNOCAK 2026
# ============================================================

camera:
  width: 1280
  height: 720
  fps: 30
  source: "csi"          # csi / webcam / test
  device_id: 0
  max_frame_loss: 30
  allow_test_fallback: false   # gerçek kamera açılmazsa test moduna düşmesin (production)

# HSV ile boru tespiti
# Degerler ABC (abc_hsv.py, seed=42) ile optimize edildi:
# sentetik dataset uzerinde IoU 0.9468 -> 1.0000.
# Gercek havuz goruntuleri geldiginde ABC tekrar kosturulacak.
detector:
  h_min: 0
  h_max: 20
  s_min: 60
  s_max: 255
  v_min: 50
  v_max: 255
  min_area: 500
  blur_kernel: 5
  morph_kernel: 5

pid:
  # Yaw PID - boru merkezleme için aktif kullanımda
  # Degerler ABC (abc_pid.py, seed=42) ile optimize edildi:
  # K=0.25, tau=0.5s plant modelinde ITAE 998.89 -> 51.11 (%94.9 azalma).
  # Gercek arac dinamigi olculdugunde ABC tekrar kosturulacak.
  yaw:
    kp: 1.485
    ki: 5.000
    kd: 0.000
    output_min: -400
    output_max: 400
    integral_limit: 200    # anti-windup üst sınırı

  # Forward PID - şu an FSM sabit hız veriyor, bu blok rezerve
  # TEKNOCAK sonrası: distance feedback ile aktif edilecek
  forward:
    kp: 0.5
    ki: 0.0
    kd: 0.0
    output_min: -300
    output_max: 300
    integral_limit: 150

fsm:
  lost_timeout_frames: 30
  found_threshold_frames: 3
  approach_area_min: 2000
  search_yaw_speed: 150
  forward_base_speed: 200
  track_slow_area_multiplier: 1.8
  track_slow_factor: 0.6

vehicle:
  connection: "udp:127.0.0.1:14551"
  baudrate: 115200
  heartbeat_timeout: 3.0
  flight_mode: "MANUAL"     # ArduSub: MANUAL / STABILIZE / ALT_HOLD (firmware'e göre)
  allow_sim_fallback: true # Pixhawk yoksa sim moduna düşmesin (production = false)
  # RC kanal mapping — ArduSub RCMAP_* parametrelerine uy:
  yaw_channel: 4            # RCMAP_YAW (default 4)
  forward_channel: 5        # RCMAP_FORWARD (default 5)
  vertical_channel: 3       # RCMAP_THROTTLE (default 3) — Ultras dikey motorlar
  pwm_base: 1500
  pwm_min: 1100
  pwm_max: 1900
  # Kanal yonu ters cikiyorsa havada test sirasinda True yap. Cuma oncesi
  # mutlaka her motor tek tek dogrula.
  yaw_reverse: false
  forward_reverse: false
  vertical_reverse: false

distance:
  method: "pinhole"       # pinhole / laser
  pipe_real_width_cm: 20.0
  focal_length_px: 500.0
  laser_baseline_cm: 15.0

safety:
  battery_warn_voltage: 13.0
  battery_critical_voltage: 12.0
  leak_pin: 17
  leak_active_high: true
  watchdog_timeout: 2.0
  max_sensor_loss: 10

log:
  directory: "logs"
  csv_enabled: true
  overlay_enabled: true
  flush_interval: 30

# Kara istasyonu UDP telemetrisi (CAT6 tether)
ground_station:
  enabled: true
  host: "192.168.2.1"      # kara istasyonu IP (ROV tether default)
  port: 14651
  send_interval_s: 0.1     # 10 Hz (main loop FPS'inden bagimsiz)

# Video stream (ROV -> yer istasyonu, UDP MJPEG)
video:
  enabled: true
  host: "192.168.2.1"      # yer istasyonu IP
  port: 14652
  send_interval_s: 0.066   # ~15 FPS - bant icin
  jpeg_quality: 60         # 1..100
  max_width: 1280           # frame bundan genise downscale

# Komut kanali (yer istasyonu -> ROV, UDP JSON)
command:
  bind: "0.0.0.0"          # ROV'da dinleme IP'si
  port: 14653
  stale_after_s: 0.5       # paket bundan eski -> link "dustu", auto'ya don
  manual_yaw_scale: 400    # -1..+1 komutu bu kadar PWM offset olur
  manual_fwd_scale: 400
  manual_vertical_scale: 400
  # ESC inrush koruma: PWM/saniye limiti. 2000 ~ 0.2 sn'de tam ranj.
  # 0 = limit yok (eski davranis). Emergency stop bu limitten bagimsiz.
  slew_rate_pwm_per_s: 2000

# Anomaly detection (yosun, pas, catlak, kopma, eksik parca)
anomaly:
  enabled: true
  algae_ratio_thresh: 0.05    # ROI'de yesil piksel orani esigi
  rust_ratio_thresh: 0.03     # ROI'de pas piksel orani esigi
  crack_min_lines: 1          # HoughLinesP minimum cizgi sayisi
  break_min_contour_area: 200 # kopma icin contour minimum alan
  missing_aspect_min: 3.0     # boru en/boy oranı bunun altıysa "eksik"